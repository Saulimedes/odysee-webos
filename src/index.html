<!DOCTYPE html>
<html lang="en" data-theme="black">
  <head>
    <meta charset="utf-8" />
    <title>Odysee</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link rel="preconnect" href="https://api.lbry.tv" crossorigin />
    <link rel="preconnect" href="https://thumbnails.odycdn.com" crossorigin />
    <link rel="preconnect" href="https://odysee.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.lbry.com" />
    <link rel="dns-prefetch" href="https://cdn.lbryplayer.xyz" />
    <script>
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem('appearance_boot'));
          if (!cached) return;
          var root = document.documentElement;
          for (var attr in cached.attrs) root.setAttribute(attr, cached.attrs[attr]);
          for (var name in cached.vars) root.style.setProperty(name, cached.vars[name]);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: #000; --text: #fff; --accent: #de0050;
        --bg-rgb: 0, 0, 0; --text-rgb: 255, 255, 255; --accent-rgb: 222, 0, 80; --accent-contrast: #fff;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      #boot {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2147483647;
        background: var(--bg); transition: opacity 0.35s ease-out; --boot-scale: 2.4;
      }
      #boot.fade-out { opacity: 0; pointer-events: none; }
      #boot pre { margin: 0; padding: 40px 60px; white-space: pre-wrap; word-break: break-word; font: 20px/1.5 monospace; color: var(--text); }
      <!--LOADER_CSS-->
      <!--CANVAS_CSS-->
      html[data-theme='ambient'] #boot { background: var(--canvas), var(--bg); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div class="loading-spinner loader-odysee"></div></div>
    <script>
      (function () {
        var ready = false;
        var started = false;
        var boot = document.getElementById('boot');
        boot.firstChild.innerHTML = <!--LOADER_MARKUP-->;

        window.__odyseeReady = function () {
          if (ready) return;
          ready = true;
          boot.className = 'fade-out';
          setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 400);
        };
        function fail(message) {
          if (ready || document.getElementById('app').firstChild) return;
          boot.innerHTML = '<pre></pre>';
          boot.firstChild.textContent = 'Odysee failed to start\n\n' + message + '\n\n' + navigator.userAgent;
        }
        window.onerror = function (message, source, line) { fail(message + '\n' + source + ':' + line); };
        window.addEventListener('unhandledrejection', function (event) {
          fail(String(event.reason && (event.reason.stack || event.reason.message || event.reason)));
        });

        function loadBundles() {
          if (started) return;
          started = true;
          ['./vendor.bundle.js', './app.bundle.js'].forEach(function (src) {
            var script = document.createElement('script');
            script.async = false;
            script.src = src;
            script.onerror = function () { fail('Could not load ' + src); };
            document.body.appendChild(script);
          });
        }
        if (document.readyState === 'complete') loadBundles();
        else window.addEventListener('load', loadBundles);
      })();
    </script>
  </body>
</html>
