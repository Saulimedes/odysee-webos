name: Quality checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:fsd
      - run: npm run lint:unused
      - run: npm run test:coverage
      - run: npm run build
      - name: Install libraries for Chrome 68
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libxss1
      - uses: actions/cache@v4
        with:
          path: /tmp/odysee-chrome68
          key: chromium68-linux-561732
      - run: npm run test:chrome68
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            coverage/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
